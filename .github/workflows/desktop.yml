# Tests on Linux and Windows, and the Windows desktop app (HYPER-OCR.exe and its installer).
# A tag v<version> also publishes the GitHub Release the in-app updater installs: the source zip
# and the installer, each with its .sha256.
name: Tests and Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract (Ubuntu's 5.3.4 and its language files)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara tesseract-ocr-osd
      - name: Packages
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps "markitdown>=0.1.2,<0.2"
      - run: python -m pytest -q

  tests-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps "markitdown>=0.1.2,<0.2"
      - name: Tesseract 5.4.0 and its languages, as the desktop app has them (pinned, checked)
        run: |
          python -m pip install "pefile>=2023.2"
          python tools/build_desktop.py tesseract build/ocr
      - run: python -m pytest -q --durations=25
        env:
          HYPEROCR_TESSERACT: ${{ github.workspace }}\build\ocr\tesseract\tesseract.exe
          HYPEROCR_TESSDATA: ${{ github.workspace }}\build\ocr\tessdata

  windows-app:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps "markitdown>=0.1.2,<0.2"
          python -m pip install -r requirements-desktop.txt
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build HYPER-OCR.exe, check it converts the test documents, build the installer
        run: python tools/build_desktop.py app --installer
      - name: Install it as a person would (silently), open it, convert with it, uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\HYPER-OCR-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "HYPER-OCR app"
          # WaitForExit, not -Wait: -Wait also waits for what the installer starts, the app itself.
          # A folder with a space, as many Windows user folders have; Start-Process doesn't quote arguments.
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          # The installer opens the app; its server answers once the window is up.
          $ok = $false
          foreach ($i in 1..60) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8766/api/system -TimeoutSec 2; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\HYPER-OCR\hyperocr.log" -ErrorAction SilentlyContinue; throw "the installed app did not start" }
          "Installed app: version $($r.version), desktop $($r.desktop), languages $($r.languages -join ', ')"
          if (-not $r.desktop) { throw "not running as the desktop app" }
          # What a person would see: screenshots of the screen (kept as an artifact).
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = Join-Path $env:RUNNER_TEMP "screens"
          New-Item -ItemType Directory -Force $shots | Out-Null
          function Shot($name) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save((Join-Path $shots "$name.png"))
              $small = New-Object System.Drawing.Bitmap $bmp, ([int]($b.Width * 0.6)), ([int]($b.Height * 0.6))
              $small.Save((Join-Path $shots "$name.jpg"), [System.Drawing.Imaging.ImageFormat]::Jpeg)
              $small.Dispose(); $g.Dispose(); $bmp.Dispose()
            } catch { "No screenshot ($name): $_" }
          }
          # The interface runs in the window once its script has called home from the Edge engine.
          $log = "$env:LOCALAPPDATA\HYPER-OCR\hyperocr.log"
          $shown = $false
          foreach ($i in 1..90) {
            if (Select-String -Path $log -Pattern "The window shows the interface" -Quiet -ErrorAction SilentlyContinue) { $shown = $true; break }
            Start-Sleep 1
          }
          "Interface running in the window: $shown"
          Start-Sleep 4
          Shot "1-opened"
          # Opening it again brings the open window forward; no second copy starts.
          $again = Start-Process "$dir\HYPER-OCR.exe" -PassThru
          if (-not $again.WaitForExit(30000)) { throw "the second start did not end" }
          Start-Sleep 2
          Shot "2-opened-again"
          $copies = @(Get-Process -Name HYPER-OCR -ErrorAction SilentlyContinue).Count
          "HYPER-OCR processes after opening it twice: $copies"
          if ($copies -ne 1) { throw "opening it again started another copy ($copies)" }
          "--- the app's log ---"
          Get-Content "$env:LOCALAPPDATA\HYPER-OCR\hyperocr.log" -ErrorAction SilentlyContinue
          "---"
          # What is on the screen, read by the app's own Tesseract, and the screen itself (as text).
          "--- text on the screen ---"
          & "$dir\tesseract\tesseract.exe" (Join-Path $shots "1-opened.png") stdout --tessdata-dir "$dir\tessdata" -l eng 2>$null |
            Where-Object { $_.Trim() } | Select-Object -First 30
          foreach ($name in "1-opened", "2-opened-again") {
            "--- screen $name.jpg, base64 ---"
            if (Test-Path (Join-Path $shots "$name.jpg")) {
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $shots "$name.jpg")))
              for ($i = 0; $i -lt $b64.Length; $i += 4000) { "B64:$name:" + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            }
          }
          "--- end ---"
          if (-not (Select-String -Path $log -Pattern "Window: Microsoft Edge WebView2" -Quiet)) { throw "the app did not open its own window" }
          if (-not $shown) { throw "the window did not show the interface" }
          Stop-Process -Name HYPER-OCR -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $out = Join-Path $env:RUNNER_TEMP "installed-self-test"
          $t = Start-Process "$dir\HYPER-OCR.exe" -ArgumentList '--self-test', "`"$pwd\tests\fixtures\scanned_arabic.pdf`"", "`"$out`"", '--lang', 'eng+ara' -Wait -PassThru
          $report = Get-Content "$out\self-test.json" -Raw -Encoding utf8 | ConvertFrom-Json
          if ($t.ExitCode -ne 0 -or -not $report.markdown.StartsWith("# تقرير المتابعة الطبية")) { throw "installed self-test failed: $($report.error)" }
          "Installed self-test: Tesseract $($report.tesseract_version), $($report.pages) page"
          # The Update button's helper: a window app reporting back through a pipe, as the app reads it.
          $upd = Join-Path $env:RUNNER_TEMP "update-check.json"
          $c = Start-Process "$dir\HYPER-OCR.exe" -ArgumentList '--update', '--check', '--json' -RedirectStandardOutput $upd -Wait -PassThru
          $state = Get-Content $upd -Raw | ConvertFrom-Json
          # GitHub limits anonymous API calls per address, and runners share addresses: an answer that
          # says so still shows the app reached GitHub over HTTPS and reported back.
          if ($state.error -match 'rate limit') { "Update check reported back: GitHub's rate limit for this runner" }
          elseif ($c.ExitCode -ne 0 -or -not $state.current) { throw "update check failed: $(Get-Content $upd -Raw)" }
          else { "Update check: this is $($state.current); latest release $($state.latest); newer available: $($state.available)" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "$dir\HYPER-OCR.exe") { throw "uninstall left the app behind" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-screenshots
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: HYPER-OCR-Setup
          path: |
            dist/HYPER-OCR-Setup-*.exe
            dist/HYPER-OCR-Setup-*.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests-linux, tests-windows, windows-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names the app's version
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"([\d.]+)\"', open('hyperocr/__init__.py').read()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, app version $v"; exit 1; }
      - name: Source zip
        run: python tools/make_release.py
      - uses: actions/download-artifact@v4
        with:
          name: HYPER-OCR-Setup
          path: dist
      - name: Publish the release (or add the files to the one already drafted for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls dist/HYPER-OCR-*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --verify-tag --title "HYPER-OCR ${GITHUB_REF_NAME#v}" \
              --notes "Windows: download HYPER-OCR-Setup-${GITHUB_REF_NAME#v}.exe and open it. Other systems: the zip, then setup (see the README)."
          fi
