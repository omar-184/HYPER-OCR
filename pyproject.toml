[project]
name = "hyperocr"
version = "1.0.0"
description = "Offline scanned-PDF converter: searchable PDF, Markdown, images and Word tables."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.26", "flask>=3.0", "waitress>=3.0", "python-docx>=1.1", "markitdown>=0.1.2,<0.2",
  "opencv-python-headless>=4.9", "numpy>=1.26", "pillow>=10.0", "pillow-heif>=0.18", "pytesseract>=0.3.10", "python-bidi>=0.5",
]

[project.scripts]
hyperocr = "hyperocr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hyperocr*"]

[tool.setuptools.package-data]
hyperocr = ["static/*", "outputs/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
