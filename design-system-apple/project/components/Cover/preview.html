<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple style App</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; min-height: 0; }
  body { background: var(--bg); color: var(--label); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; fill: none; stroke: none; }
  .accent { fill: var(--accent); }
  .ink { fill: var(--label); }
  .green { fill: var(--tile-green); }
  .orange { fill: var(--tile-orange); }
  .indigo { fill: var(--tile-indigo); }
  .blk { rx: var(--radius-group); }
  .sq { rx: var(--radius-tile); }
  .words { position: absolute; left: var(--space-section); bottom: var(--space-section); max-width: 440px; }
  .name { margin: 0; font-size: 64px; line-height: .95; font-weight: 700; letter-spacing: -0.026em; color: var(--label); }
  .tag { margin: var(--space-row-gap) 0 0; font-family: var(--font-text); font-size: 14px; line-height: 20px; letter-spacing: -0.01em; color: var(--label-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 200×222 slab bled off the top (system blue, the identity) · label (ink) 280×176 bleeding off the right edge · tile-green 120×88 and tile-orange 72×88 bled off the top · tile-indigo only in the pattern (≈ 40% of 960×288)
  arrangement one tall accent slab with satellites; block bottoms on one line, space-group (24px) above the edge; space-gutter (16px) between blocks
  pattern     squircle tiles, from "Row icon tiles: 28px, radius-tile, one colour per meaning" and "geometric, modular, dense UI": 14 tiles in a size-tile grid at a 40px pitch (28 + space-row-gap), three merged two-wide like grouped rows, cut into the ink block
  scales      tiles size-tile 28 with radius-tile 7; pitch size-tile + space-row-gap; blocks radius-group 14; gutters space-gutter 16
-->
<rect class="accent blk" x="0" y="-14" width="200" height="278" rx="14"/>
<rect class="green blk" x="216" y="-14" width="120" height="88" rx="14"/>
<rect class="orange blk" x="352" y="-14" width="72" height="88" rx="14"/>
<rect class="ink blk" x="216" y="88" width="280" height="176" rx="14"/>
<rect class="accent sq" x="240" y="112" width="28" height="28" rx="7"/>
<rect class="green sq" x="280" y="112" width="68" height="28" rx="7"/>
<rect class="orange sq" x="400" y="112" width="28" height="28" rx="7"/>
<rect class="indigo sq" x="440" y="112" width="28" height="28" rx="7"/>
<rect class="indigo sq" x="240" y="152" width="28" height="28" rx="7"/>
<rect class="accent sq" x="320" y="152" width="28" height="28" rx="7"/>
<rect class="orange sq" x="360" y="152" width="68" height="28" rx="7"/>
<rect class="green sq" x="240" y="192" width="28" height="28" rx="7"/>
<rect class="orange sq" x="280" y="192" width="28" height="28" rx="7"/>
<rect class="accent sq" x="360" y="192" width="28" height="28" rx="7"/>
<rect class="green sq" x="440" y="192" width="28" height="28" rx="7"/>
<rect class="orange sq" x="240" y="232" width="28" height="28" rx="7"/>
<rect class="indigo sq" x="320" y="232" width="68" height="28" rx="7"/>
<rect class="accent sq" x="400" y="232" width="28" height="28" rx="7"/>
</svg>
</div>
<div class="words">
<h1 class="name">Apple style<br>App</h1>
<p class="tag">System colours, grouped lists and springs, in light and dark.</p>
</div>
</div>
</body>
</html>
