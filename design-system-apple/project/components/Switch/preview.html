<div class="pv">
<div class="group">
  <label class="row"><span class="tile tile-red"><svg><use href="#i-doc"/></svg></span><span class="row-label">Searchable PDF</span><input type="checkbox" class="switch" role="switch" checked></label>
  <label class="row"><span class="tile tile-gray"><svg><use href="#i-text"/></svg></span><span class="row-label">Markdown File</span><input type="checkbox" class="switch" role="switch" checked></label>
  <label class="row"><span class="tile tile-blue"><svg><use href="#i-photo"/></svg></span><span class="row-label">Pictures and Figures</span><input type="checkbox" class="switch" role="switch"></label>
  <label class="row"><span class="tile tile-green"><svg><use href="#i-table"/></svg></span><span class="row-label">Tables as Word Files</span><input type="checkbox" class="switch" role="switch"></label>
</div>
<p class="section-footer">You get one ZIP: a searchable PDF and a Markdown file.</p>
<div class="group">
  <label class="row"><span class="tile tile-indigo"><svg><use href="#i-text"/></svg></span><span class="row-label"><span>Use the PDF’s Own Text</span><small>Pages made on a computer are taken as they are: exact, and far faster. Scanned pages are still read.</small></span><input type="checkbox" class="switch" role="switch" checked></label>
</div>
<div class="group">
  <label class="row"><span class="tile tile-orange"><svg><use href="#i-text"/></svg></span><span class="row-label">Leave page headers, footers and numbers out of the Markdown</span><input type="checkbox" class="switch" role="switch" checked></label>
</div>
<div class="group" dir="rtl" lang="ar">
  <label class="row"><span class="tile tile-orange"><svg><use href="#i-text"/></svg></span><span class="row-label">استبعاد ترويسة الصفحة وتذييلها وأرقامها من ملف Markdown</span><input type="checkbox" class="switch" role="switch"></label>
</div>
</div>
